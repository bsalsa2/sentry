<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="description" content="Sentry - AI-powered surveillance monitoring." />

    <!-- Social preview cards - what a share to iMessage, Slack or X shows. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sentry" />
    <meta property="og:title" content="Sentry - the Outpost camera" />
    <meta property="og:description" content="A standalone security camera with the thinking built in. It knows the difference between a delivery and a stranger, and says so in one sentence." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sentry - the Outpost camera" />
    <meta name="twitter:description" content="A standalone security camera with the thinking built in. It knows the difference between a delivery and a stranger, and says so in one sentence." />

    <!-- Lets iPhone users "Add to Home Screen" and get an app-like window. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Bodoni Moda carries the wordmark and every display statement; Jost
         carries everything else, from prose down to tracked-out labels and
         tabular numerals. Preconnect first so the fonts start downloading
         before the CSS is even parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,300;6..96,400;6..96,500&family=Jost:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Sentry</title>
  </head>
  <body>
    <!-- React draws the whole app inside this div. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
